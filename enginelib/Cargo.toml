[package]
name = "enginelib"
version = "0.2.0"
edition = "2024"
description = "A library for the GE engine allowing for modding and removing boilerplate."
license-file = "LICENSE.md"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
macros = { path = "./macros" }
directories = "6.0.0"
libloading = "0.9.0"
oxifs = "0.1.0"
serde = { workspace = true }
toml = { workspace = true }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
chrono = { version = "0.4.44", features = ["serde"] }
tokio = { version = "1.50.0", features = ["full"] }
postcard = { version = "1.1.3", features = ["use-std"] }
inventory = "0.3.22"
crossbeam = "0.8.4"
dashmap = "6.2.1"
async-channel = "2.5.0"
druid = {git="https://github.com/voltaero/druid.git"}
rayon = "1.12.0"
[build-dependencies]
vergen-gix = { version = "9.1.0", features = ["build", "cargo", "rustc"] }
# Profiles moved to the workspace root Cargo.toml — Cargo ignores profile
# tables in non-root member manifests.
[dev-dependencies]
tracing-test = "0.2.6"
[dependencies.rust-rocksdb]
features = ["jemalloc"]
version = "0.51.0"
