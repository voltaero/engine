[package]
name = "engine"
version = "0.3.0"
edition = "2024"
license-file = "LICENSE.md"
description = "A Blazingly fast distributed task system"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = []
dev = []
# Experimental: sandboxed `.wasm` task mods (server) and the `wasm_worker` bin.
wasm = ["dep:enginewasm"]
[dependencies]
enginewasm = { path = "../enginewasm", optional = true }

enginelib = { path = "../enginelib" }
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"

[[bin]]
name = "wasm_worker"
required-features = ["wasm"]
