[package]
name = "enginewasm"
version = "0.3.0"
edition = "2024"
license-file = "../LICENSE.md"
description = "Experimental: sandboxed WebAssembly task mods with an optional WebGPU compute path."

[features]
default = ["gpu"]
# WGSL kernels run through wgpu (Vulkan/Metal/DX12) and are checked with naga.
gpu = ["dep:wgpu", "dep:naga", "dep:pollster"]

[dependencies]
enginelib = { path = "../enginelib" }
serde = { workspace = true }
toml = { workspace = true }
tracing = "0.1.44"
# Core wasm only: no component model, GC, threads or WASI, so a mod has
# nothing to call but the imports `sandbox.rs` defines.
wasmtime = { version = "49.0.2", default-features = false, features = [
    "anyhow",
    "cranelift",
    "parallel-compilation",
    "runtime",
    "std",
] }
wasmparser = { version = "0.258.3", default-features = false, features = ["std"] }
wgpu = { version = "30.0.1", optional = true }
naga = { version = "30.0.1", features = ["wgsl-in"], optional = true }
pollster = { version = "0.4.0", optional = true }

[dev-dependencies]
wat = "1.258"
tokio = { version = "1.50.0", features = ["rt-multi-thread"] }
